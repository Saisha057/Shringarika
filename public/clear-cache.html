<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clear Cache - Shringarika</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-center;
      min-height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    .container {
      background: white;
      padding: 3rem;
      border-radius: 1rem;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      text-align: center;
      max-width: 500px;
    }
    h1 {
      margin: 0 0 1rem;
      color: #333;
    }
    p {
      color: #666;
      margin-bottom: 2rem;
    }
    button {
      background: #667eea;
      color: white;
      border: none;
      padding: 1rem 2rem;
      border-radius: 0.5rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }
    button:hover {
      background: #5568d3;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }
    .success {
      color: #10b981;
      font-weight: 600;
      margin-top: 1rem;
      display: none;
    }
    .success.show {
      display: block;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔄 Clear Product Cache</h1>
    <p>Click the button below to clear the product cache and fetch the latest data from the server.</p>
    <button id="clearBtn">Clear Cache & Reload</button>
    <p class="success" id="successMsg">✅ Cache cleared! Redirecting to homepage...</p>
  </div>

  <script>
    document.getElementById('clearBtn').addEventListener('click', function() {
      // Clear all product-related localStorage
      const keysToRemove = [
        'adminProducts',
        'adminStock',
        'adminNotifications',
        'fashionCart',
        'recentlyViewed'
      ];
      
      keysToRemove.forEach(key => {
        localStorage.removeItem(key);
        console.log(`Removed: ${key}`);
      });
      
      // Show success message
      document.getElementById('successMsg').classList.add('show');
      
      // Redirect to homepage after 1.5 seconds
      setTimeout(() => {
        window.location.href = '/';
      }, 1500);
    });
  </script>
</body>
</html>
